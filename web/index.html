<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    $FLUTTER_BASE_HREF is replaced with the value of `--base-href` at build time ("/" by default).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stephen Kings - Flutter developer building high-performance apps for mobile, web and desktop.">
  <meta name="keywords" content="Stephen Kings, Kings Stephen, Flutter developer, mobile app developer, portfolio">
  <meta name="author" content="Stephen Kings">
  <meta name="theme-color" content="#0E0E10">

  <!-- Social previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Stephen Kings - Portfolio">
  <meta property="og:description" content="Flutter developer building high-performance apps for mobile, web and desktop.">
  <meta property="og:image" content="icons/android-chrome-512x512.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stephen Kings">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="icon" href="favicon.ico">

  <title>Stephen Kings - Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="bar"></div>
    <div class="bar"></div>
