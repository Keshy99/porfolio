name: kings
description: Stephen Kings portfolio website

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  community_material_icon: ^5.9.55
  cupertino_icons: ^1.0.8
  easy_image_viewer: ^1.5.1
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^15.2.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/expensetracker/
    - assets/borku/
    - assets/blott/
    - assets/cardza/
    - assets/stripe/
    - assets/hermex/
    - assets/herssa/
    - assets/excelmind/
    - assets/excelmindit/
    - assets/sdd/
    - assets/pricing_icons/
    - assets/chatapp/
    - assets/meals/
    - assets/ticketapp/
